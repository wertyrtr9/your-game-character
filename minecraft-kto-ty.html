<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT | Кто ты?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Press Start 2P", monospace;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: radial-gradient(ellipse at top, #2a4d1a 0%, #000000 70%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100dvh;
      gap: 32px;
      text-transform: uppercase;
      text-align: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .grass {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: linear-gradient(180deg, #4a6b2a 0%, #2a4d1a 100%);
      border-top: 4px solid #5c7c3a;
      pointer-events: none;
      z-index: 0;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 1;
    }

    .minecraft-logo {
      font-size: clamp(10px, 2vw, 16px);
      letter-spacing: 10px;
      text-indent: 10px;
      color: #55FF55;
      text-shadow: 3px 3px 0 #002800, 0 0 15px rgba(85, 255, 85, 0.6);
    }

    .minecraft-subtitle {
      font-size: clamp(6px, 1vw, 10px);
      color: #FFFF55;
      letter-spacing: 6px;
      text-indent: 6px;
      text-shadow: 2px 2px 0 #554400;
    }

    .dialogue-frame {
      width: min(880px, 90vw);
      background-color: #C6C6C6;
      border: 4px solid #000000;
      box-shadow: 
        inset 4px 4px 0 #FFFFFF,
        inset -4px -4px 0 #555555,
        0 0 30px rgba(85, 255, 85, 0.3);
      padding: clamp(16px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 4vw, 32px);
      position: relative;
      z-index: 1;
    }

    .dialogue-inner {
      background-color: #8B8B8B;
      border: 2px solid #000000;
      box-shadow:
        inset 2px 2px 0 #373737,
        inset -2px -2px 0 #FFFFFF;
      padding: clamp(16px, 4vw, 32px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 4vw, 32px);
    }

    .star {
      position: absolute;
      left: clamp(20px, 5vw, 40px);
      top: clamp(24px, 6vw, 48px);
      font-size: clamp(8px, 1.6vw, 12px);
      color: #FFFF55;
      text-shadow: 2px 2px 0 #000000, 0 0 8px rgba(255, 255, 85, 0.8);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .dialogue-text {
      font-size: clamp(8px, 1.6vw, 12px);
      line-height: 2.2;
      text-align: left;
      padding-left: clamp(20px, 6vw, 48px);
      min-height: clamp(72px, 12vw, 96px);
      display: flex;
      align-items: center;
      white-space: normal;
      color: #FFFFFF;
      text-shadow: 2px 2px 0 #3F3F3F;
    }

    .character-name {
      color: #55FF55;
      text-shadow: 2px 2px 0 #005500, 0 0 10px rgba(85, 255, 85, 0.6);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .minecraft-button {
      background: linear-gradient(180deg, #C6C6C6 0%, #A0A0A0 100%);
      color: #FFFFFF;
      border: 2px solid #000000;
      font-size: clamp(8px, 1.6vw, 12px);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      padding: 10px 24px;
      text-shadow: 2px 2px 0 #3F3F3F;
      box-shadow: 
        inset 2px 2px 0 #FFFFFF,
        inset -2px -2px 0 #555555;
      position: relative;
      transition: all 0.1s steps(2);
    }

    .minecraft-button::before {
      content: "*";
      opacity: 0;
      transition: opacity 150ms steps(2);
      text-shadow: 2px 2px 0 #3F3F3F;
    }

    .minecraft-button:hover::before,
    .minecraft-button:focus-visible::before {
      opacity: 1;
    }

    .minecraft-button:hover,
    .minecraft-button:focus-visible {
      color: #FFFF55;
      outline: none;
      text-shadow: 2px 2px 0 #3F3F3F, 0 0 10px rgba(255, 255, 85, 0.6);
    }

    .minecraft-button:active {
      box-shadow: 
        inset 2px 2px 0 #555555,
        inset -2px -2px 0 #FFFFFF;
      transform: translate(1px, 1px);
    }

    .back-button {
      background: linear-gradient(180deg, #C6C6C6 0%, #A0A0A0 100%);
      color: #FFFFFF;
      border: 2px solid #000000;
      font-size: clamp(6px, 1vw, 8px);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 8px 16px;
      text-decoration: none;
      position: relative;
      z-index: 1;
      text-shadow: 2px 2px 0 #3F3F3F;
      box-shadow: 
        inset 2px 2px 0 #FFFFFF,
        inset -2px -2px 0 #555555;
      transition: all 0.1s steps(2);
    }

    .back-button::before {
      content: "*";
      opacity: 0;
      transition: opacity 150ms steps(2);
      text-shadow: 2px 2px 0 #3F3F3F;
    }

    .back-button:hover::before,
    .back-button:focus-visible::before {
      opacity: 1;
    }

    .back-button:hover,
    .back-button:focus-visible {
      color: #55FF55;
      outline: none;
      text-shadow: 2px 2px 0 #3F3F3F, 0 0 10px rgba(85, 255, 85, 0.6);
    }

    .back-button:active {
      box-shadow: 
        inset 2px 2px 0 #555555,
        inset -2px -2px 0 #FFFFFF;
      transform: translate(1px, 1px);
    }

    footer {
      font-size: clamp(6px, 1vw, 8px);
      color: #AAAAAA;
      letter-spacing: 4px;
      text-indent: 4px;
      z-index: 1;
      text-shadow: 2px 2px 0 #000000;
    }
  </style>
</head>

<body>
  <header>
    <div class="minecraft-logo">MINECRAFT</div>
    <div class="minecraft-subtitle">КТО ЖЕ ТЫ?</div>
  </header>

  <main class="dialogue-frame">
    <div class="dialogue-inner">
      <span class="star">*</span>
      <div class="dialogue-text" id="dialogue-text">
        Нажми кнопку, чтобы узнать, кем ты являешься в этом мире...
      </div>
      <div class="actions">
        <button class="minecraft-button" id="who-are-you">
          КТО ТЫ?
        </button>
      </div>
    </div>
  </main>

  <a class="back-button" href="index.html">
    НАЗАД В МЕНЮ
  </a>

  <footer>
    * CREEPER AWWW MAN *
  </footer>

  <script>
    const characters = [
      "STEVE",
      "ALEX",
      "CREEPER",
      "ZOMBIE",
      "SKELETON",
      "ENDERMAN",
      "SPIDER",
      "SLIME",
      "WITCH",
      "VILLAGER",
      "IRON GOLEM",
      "SNOW GOLEM",
      "PIGLIN",
      "ZOMBIFIED PIGLIN",
      "BLAZE",
      "GHAST",
      "WITHER SKELETON",
      "PHANTOM",
      "WARDEN",
      "AXOLOTL",
      "ALLAY",
      "ENDERMITE",
      "SHULKER",
      "STRIDER",
      "HOGLIN",
      "ZOGLIN",
      "ENDER DRAGON",
      "WITHER",
      "HEROBRINE"
    ];

    const dialogueText = document.getElementById("dialogue-text");
    const button = document.getElementById("who-are-you");

    button.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * characters.length);
      const picked = characters[randomIndex];

      dialogueText.innerHTML = `Ты...<br><span class=\"character-name\">${picked}</span>!`;
    });
  </script>
</body>

</html>
